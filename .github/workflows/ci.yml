name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualita:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Valori fittizi: il build non si connette al database, ma le variabili
      # devono esistere perché i moduli si inizializzino.
      DATABASE_URL: postgresql://utente:password@localhost:5432/placeholder
      DIRECT_URL: postgresql://utente:password@localhost:5432/placeholder
      BETTER_AUTH_SECRET: ci-secret-non-usato-in-produzione
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      # Nessun `version:` qui: pnpm/action-setup si rifiuta di partire se la
      # versione e' dichiarata sia nel workflow sia in package.json
      # ("Multiple versions of pnpm specified"), e la CI muore prima di
      # eseguire qualsiasi test. Decide `packageManager` in package.json, che
      # e' anche piu' preciso: 11.2.2 esatta invece di "11".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      - name: Formattazione
        run: pnpm format

      - name: Lint e typecheck
        run: pnpm lint

      - name: Test del motore di calcolo
        run: pnpm test

      - name: Build di produzione
        run: pnpm build

  schema:
    name: Migrazioni e coerenza dello schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: advisorhub
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: advisorhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U advisorhub -d advisorhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://advisorhub:ci@localhost:5432/advisorhub
      DIRECT_URL: postgresql://advisorhub:ci@localhost:5432/advisorhub
      BETTER_AUTH_SECRET: ci-secret-non-usato-in-produzione
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      # Nessun `version:` qui: pnpm/action-setup si rifiuta di partire se la
      # versione e' dichiarata sia nel workflow sia in package.json
      # ("Multiple versions of pnpm specified"), e la CI muore prima di
      # eseguire qualsiasi test. Decide `packageManager` in package.json, che
      # e' anche piu' preciso: 11.2.2 esatta invece di "11".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Le migrazioni si applicano davvero su un database vuoto. Fino a oggi
      # nessuno lo verificava: il primo a scoprirlo sarebbe stato un cliente.
      - name: Applica le migrazioni su database vuoto
        run: pnpm --filter web db:migrate

      # Deriva fra schema e migrazioni: se qualcuno modifica schema-dominio.ts
      # senza generare la migrazione, qui si vede. Prima no.
      - name: Coerenza schema ↔ migrazioni
        run: pnpm --filter web exec drizzle-kit check

  e2e:
    name: Test end-to-end sulla build di produzione
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: advisorhub
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: advisorhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U advisorhub -d advisorhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
    env:
      E2E_DATABASE_URL: postgresql://advisorhub:ci@127.0.0.1:5432/advisorhub
      DATABASE_URL: postgresql://advisorhub:ci@127.0.0.1:5432/advisorhub
      DIRECT_URL: postgresql://advisorhub:ci@127.0.0.1:5432/advisorhub
      BETTER_AUTH_SECRET: ci-secret-non-usato-in-produzione
      BETTER_AUTH_URL: http://127.0.0.1:3100

    steps:
      - uses: actions/checkout@v4
      # Nessun `version:` qui: pnpm/action-setup si rifiuta di partire se la
      # versione e' dichiarata sia nel workflow sia in package.json
      # ("Multiple versions of pnpm specified"), e la CI muore prima di
      # eseguire qualsiasi test. Decide `packageManager` in package.json, che
      # e' anche piu' preciso: 11.2.2 esatta invece di "11".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Browser per Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Migrazioni
        run: pnpm --filter web db:migrate

      # Build standalone + copia di .next/static + bundle del worker della posta.
      # `next start` NON funziona con output:"standalone" (GUASTI G-06): i test
      # girano contro il server standalone, cioè l'artefatto che va in produzione.
      - name: Prepara la build di produzione
        run: pnpm --filter web e2e:prepara

      # Cancello di sicurezza sul perimetro che spediamo DAVVERO.
      #
      # Sta qui e non nel lavoro `sicurezza` perché ha bisogno della build, e
      # questo lavoro la fa comunque: non costa una seconda compilazione.
      #
      # Prima il cancello era `pnpm audit --audit-level=high` sull'albero
      # completo, e bloccava il RILASCIO (`immagine` dipende da `sicurezza`)
      # per avvisi che vivono in eslint e nella CLI di shadcn. Misurato il 19
      # settembre 2026: 18 alti nell'albero, 10 con --prod, 1 dentro
      # l'immagine (il 21, dopo un aggiornamento del lockfile, zero ovunque).
      # Severo sul perimetro sbagliato è severo per finta.
      - name: Sicurezza del perimetro spedito
        run: node deploy/audit-artefatto.mjs

      # Tetto al JavaScript per pagina. Non rende veloce niente: si accorge di
      # una REGRESSIONE, che è l'unica cosa che le misure di tempo su una
      # macchina condivisa non riescono a fare (il benchmarkIndex di Lighthouse
      # oscilla del doppio fra una corsa e l'altra). I KB non dipendono dalla
      # CPU di chi misura.
      - name: Peso del JavaScript per pagina
        run: node deploy/budget-js.mjs

      - name: Test end-to-end
        run: pnpm --filter web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  sicurezza:
    name: Dipendenze e segreti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Nessun `version:` qui: pnpm/action-setup si rifiuta di partire se la
      # versione e' dichiarata sia nel workflow sia in package.json
      # ("Multiple versions of pnpm specified"), e la CI muore prima di
      # eseguire qualsiasi test. Decide `packageManager` in package.json, che
      # e' anche piu' preciso: 11.2.2 esatta invece di "11".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # L'audit delle dipendenze NON sta più qui: il cancello bloccante vive nel
      # lavoro end-to-end e guarda l'artefatto spedito (`audit-artefatto.mjs`),
      # mentre il quadro completo lo pubblica il lavoro `avvisi`, che non blocca.
      #
      # Nessun .env, chiave privata o segreto verosimile nel repository.
      - name: Nessun segreto nel repository
        run: bash deploy/check-no-secrets.sh

  # Quadro COMPLETO delle vulnerabilità, strumenti di sviluppo inclusi.
  #
  # Volutamente FUORI da `needs` di `immagine`: informa, non blocca.
  #
  # È un lavoro a sé e non un `continue-on-error` dentro `sicurezza`, per due
  # ragioni. Un cancello che a volte non blocca rende ambiguo il proprio verde:
  # il nome prometterebbe una cosa che l'esito non significa più. E qui NON si
  # usa `continue-on-error` nemmeno sul lavoro separato, perché renderebbe verde
  # un lavoro che ha trovato qualcosa: diventa rosso e si vede, ma non essendo
  # fra le dipendenze di `immagine` non ferma il rilascio.
  #
  # Si chiama `avvisi` e non `sicurezza-completa` proprio perché nessuno lo
  # scambi per un cancello.
  #
  # ROSSO DEVE ESSERE L'ECCEZIONE. Per giorni questo lavoro e' stato rosso a
  # ogni corsa, e il risultato e' stato che ogni corsa di `main` sembrava
  # fallita: qualcuno ne ha dedotto che un controllo verde non fosse mai stato
  # eseguito (GUASTI G-41). La causa non era irrisolvibile, era trascurata: un
  # lockfile mai aggiornato. Quando torna rosso, la prima mossa e'
  #   pnpm update -r --depth Infinity <pacchetti segnalati>
  # seguito dalla verifica completa (build compresa: lint e typecheck non
  # guardano i fogli di stile, G-42). `continue-on-error` e' l'ultima risorsa,
  # non la prima.
  avvisi:
    name: Avvisi sulle dipendenze (non bloccante)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Albero completo
        run: pnpm audit --audit-level=high

  immagine:
    name: Costruisci e pubblica l'immagine
    # Solo su main e solo se tutto il resto è verde: un'immagine che nessuno può
    # distribuire è meno dannosa di una rotta che qualcuno distribuisce.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [qualita, schema, e2e, sicurezza]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadati
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Il tag col commit è quello che finisce in IMMAGINE nel provisioning:
          # ogni istanza dichiara esattamente quale codice sta servendo.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Costruisci e pubblica
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
          # NESSUN segreto fra i build-args: le variabili di un'immagine si
          # leggono senza avviarla, anche da un registry privato (GUASTI G-20).
          # Il DSN della telemetria si passa alla build dell'istanza, non qui.

      - name: Nessun segreto nell'immagine
        run: |
          IMG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker pull "$IMG"
          echo "— variabili dell'immagine —"
          docker image inspect "$IMG" --format '{{range .Config.Env}}{{println .}}{{end}}'
          if docker image inspect "$IMG" --format '{{range .Config.Env}}{{println .}}{{end}}' \
             | grep -iE '(SECRET|PASSWORD|TOKEN|API_KEY)='; then
            echo "ERRORE: segreto nelle variabili dell'immagine"; exit 1
          fi
          echo "— contenuto di /app/apps/web —"
          docker run --rm --entrypoint sh "$IMG" -c 'ls -A /app/apps/web'
          if docker run --rm --entrypoint sh "$IMG" -c 'ls -d /app/apps/web/src 2>/dev/null'; then
            echo "ERRORE: src/ finito nell'immagine (GUASTI G-14)"; exit 1
          fi
