packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@sentry/cli": true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@next/env@16.2.11"
  - "@next/eslint-plugin-next@16.2.11"
  - "@next/swc-darwin-arm64@16.2.11"
  - "@next/swc-darwin-x64@16.2.11"
  - "@next/swc-linux-arm64-gnu@16.2.11"
  - "@next/swc-linux-arm64-musl@16.2.11"
  - "@next/swc-linux-x64-gnu@16.2.11"
  - "@next/swc-linux-x64-musl@16.2.11"
  - "@next/swc-win32-arm64-msvc@16.2.11"
  - "@next/swc-win32-x64-msvc@16.2.11"
  - eslint-config-next@16.2.11
  - next@16.2.11

# Eccezioni PUNTUALI all'audit di sicurezza.
#
# Le impostazioni vivono qui e non in package.json: pnpm 11 non legge piu' il
# campo `pnpm` del manifesto, e lo ignora con un AVVISO, non con un errore.
# Un'eccezione scritta nel posto sbagliato non filtra niente e sembra attiva.
#
# Motivazione e data di revisione stanno in "//eccezioni-audit" nel
# package.json di radice. Non si aggiunge una riga qui senza entrambe:
# un'eccezione senza scadenza si eredita per sempre e smette di essere una
# decisione.
auditConfig:
  ignoreGhsas:
    # nanoid <3.3.18: ciclo infinito con generatori PERSONALIZZATI, che non
    # passiamo. Vive solo nella copia compilata dentro Next. Revisione 2026-12-19.
    - GHSA-2v37-7h3g-55p8
